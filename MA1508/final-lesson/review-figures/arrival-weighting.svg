<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Two arrival-time weightings</title><desc id="desc">Uniform time weighting has mean one half; arrival-weighted time has mean two thirds.</desc><rect width="720" height="360" fill="#fffefb"/><line x1="85" y1="300" x2="625" y2="300" stroke="#17324d" stroke-width="2" /><line x1="85" y1="300" x2="85" y2="60" stroke="#17324d" stroke-width="2" /><text x="635" y="305" font-family="system-ui,sans-serif" font-size="16" text-anchor="start" fill="#17324d">t</text><text x="75" y="50" font-family="system-ui,sans-serif" font-size="16" text-anchor="end" fill="#17324d">density</text><path d="M85 300 L585 70 L585 300 Z" fill="#287b78" opacity=".18"/><line x1="85" y1="300" x2="585" y2="70" stroke="#287b78" stroke-width="2" /><line x1="85" y1="185" x2="585" y2="185" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="8 5"/><text x="360" y="58" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle" fill="#287b78">arrival density: 2t</text><text x="360" y="173" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle" fill="#6b4fa0">uniform density: 1</text><line x1="335" y1="300" x2="335" y2="185" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="4 4"/><line x1="418.3333333333333" y1="300" x2="418.3333333333333" y2="146.66666666666669" stroke="#287b78" stroke-width="2" stroke-dasharray="4 4"/><text x="335" y="330" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#6b4fa0">mean 1/2</text><text x="418.3333333333333" y="350" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#287b78">mean 2/3</text></svg>