<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">Signed area</title><desc id="desc">The two triangles have signed areas minus four and plus four.</desc><rect width="720" height="360" fill="#fffefb"/><line x1="90" y1="275" x2="630" y2="275" stroke="#17324d" stroke-width="2" /><line x1="90" y1="275" x2="90" y2="55" stroke="#17324d" stroke-width="2" /><text x="640" y="280" font-family="system-ui,sans-serif" font-size="16" text-anchor="start" fill="#17324d">t</text><text x="80" y="45" font-family="system-ui,sans-serif" font-size="16" text-anchor="end" fill="#17324d">f(t)</text><path d="M90 165 L360 165 L360 275 Z" fill="#cc785c" opacity=".22"/><path d="M360 165 L630 55 L360 165 Z" fill="#287b78" opacity=".2"/><line x1="90" y1="275" x2="630" y2="55" stroke="#17324d" stroke-width="2" /><line x1="360" y1="275" x2="360" y2="165" stroke="#6c6a64" stroke-width="2" stroke-dasharray="6 5"/><text x="360" y="305" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#17324d">2</text><text x="180" y="230" font-family="system-ui,sans-serif" font-size="28" text-anchor="middle" fill="#a9583e">−4</text><text x="470" y="95" font-family="system-ui,sans-serif" font-size="28" text-anchor="middle" fill="#287b78">+4</text><text x="90" y="35" font-family="system-ui,sans-serif" font-size="20" text-anchor="start" fill="#17324d">f(t) = 2t − 4</text></svg>