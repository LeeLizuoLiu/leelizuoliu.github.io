<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 245" role="img" aria-labelledby="title desc">
<title id="title">Three enlargements of curve arcs and their chords</title><desc id="desc">From top to bottom are magnified arcs over progressively smaller parameter intervals. Each coral chord joins its arc endpoints. As the parameter interval shrinks, the smooth teal arc approaches its chord.</desc>
