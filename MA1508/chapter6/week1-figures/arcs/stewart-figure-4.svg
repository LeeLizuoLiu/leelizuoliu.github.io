<g font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#343432" stroke-linecap="round" stroke-linejoin="round">

<g fill="none" stroke-width="2.6">
 <path d="M90 27Q200 18 310 73 M90 101Q200 112 310 147 M90 175Q200 196 310 221" stroke="#16736d"/>
 <path d="M90 27L310 73 M90 101L310 147 M90 175L310 221" stroke="#a9583e"/>
</g>
<g fill="#a9583e"><circle cx="90" cy="27" r="3"/><circle cx="310" cy="73" r="3"/><circle cx="90" cy="101" r="3"/><circle cx="310" cy="147" r="3"/><circle cx="90" cy="175" r="3"/><circle cx="310" cy="221" r="3"/></g>
<g font-size="16">
<text x="25" y="30">P<tspan baseline-shift="sub" font-size="14">i−1</tspan></text><text x="319" y="78">P<tspan baseline-shift="sub" font-size="14">i</tspan></text>
<text x="25" y="104">P<tspan baseline-shift="sub" font-size="14">i−1</tspan></text><text x="319" y="152">P<tspan baseline-shift="sub" font-size="14">i</tspan></text>
<text x="25" y="178">P<tspan baseline-shift="sub" font-size="14">i−1</tspan></text><text x="319" y="226">P<tspan baseline-shift="sub" font-size="14">i</tspan></text>
<text x="350" y="41" font-size="16">larger Δt</text><text x="350" y="210" font-size="16">smaller Δt</text>
</g>
