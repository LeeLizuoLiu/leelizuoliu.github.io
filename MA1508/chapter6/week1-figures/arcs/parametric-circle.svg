<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 225" role="img" aria-labelledby="title desc">
<title id="title">Parametrized circle traced once</title><desc id="desc">The parametrization x equals R cosine t and y equals R sine t travels counterclockwise around a circle of radius R, starting and ending at the point R zero as t runs from zero to two pi.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<g font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#343432" stroke-linecap="round" stroke-linejoin="round">

<path d="M36 112H275 M150 215V18" fill="none" stroke="#625e58" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="150" cy="112" r="76" fill="none" stroke="#16736d" stroke-width="3.5"/>
<path d="M224 94A76 76 0 0 0 158 36" fill="none" stroke="#a9583e" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M150 112H224" fill="none" stroke="#6b4fa0" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="150" cy="112" r="2.5"/><circle cx="226" cy="112" r="4" fill="#16736d"/>
<text x="178" y="103" fill="#6b4fa0">R</text><text x="137" y="132">0</text><text x="271" y="130">x</text><text x="136" y="17">y</text>
<text x="240" y="145" font-size="18">t = 0, 2π</text>

</g></svg>