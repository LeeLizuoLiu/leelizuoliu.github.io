<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 215" role="img" aria-labelledby="title desc">
<title id="title">Washer from a horizontal strip</title><desc id="desc">The shaded region between y equals x and y equals x squared is rotated around the vertical y-axis. A horizontal strip runs from x equals y to x equals square root y; the resulting washer has inner radius y and outer radius square root y.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<g font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#343432" stroke-linecap="round" stroke-linejoin="round">
<path d="M50 185L190 45Q120 185 50 185Z" fill="#e9e0f4"/>
<path d="M50 185L190 45" fill="none" stroke="#6b4fa0" stroke-width="3"/><path d="M50 185Q120 185 190 45" fill="none" stroke="#16736d" stroke-width="3"/>
<path d="M40 185H211 M50 200V25" fill="none" stroke="#625e58" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M127 104H154V112H127Z" fill="#cc785c" stroke="#a9583e" stroke-width="1.5"/><path d="M50 108H127" fill="none" stroke="#a9583e" stroke-width="1.3" stroke-dasharray="4 4"/>
<text x="209" y="204">x</text><text x="33" y="25">y</text><text x="32" y="204">0</text><text x="182" y="204">1</text>
<text x="141" y="64" fill="#6b4fa0">y = x</text><text x="145" y="151" fill="#16736d">y = x²</text>
<circle cx="285" cy="107" r="54" fill="#e9e0f4" stroke="#6b4fa0" stroke-width="2"/><circle cx="285" cy="107" r="30" fill="#fffdfa" stroke="#6b4fa0" stroke-width="2"/>
<circle cx="285" cy="107" r="2.5" fill="#343432"/><path d="M285 107L337 107 M285 107L285 78" stroke="#a9583e" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
<text x="257" y="39" fill="#a9583e">r = y</text><text x="254" y="190" fill="#a9583e">R = √y</text>
</g></svg>