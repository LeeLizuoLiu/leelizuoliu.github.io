<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 215" role="img" aria-labelledby="title desc"><title id="title">Cone cut by a plane</title><desc id="desc">A cone sliced perpendicular to its axis produces a circle; its radius and area vary along the cone.</desc><g font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#48433e" stroke-linejoin="round" stroke-linecap="round"><path d="M35 110 L190 42 A26 68 0 0 1 190 178Z" fill="#e5f0ec" stroke="#16736d" stroke-width="2"/><ellipse cx="190" cy="110" rx="26" ry="68" fill="#d6e8e3" stroke="#16736d" stroke-width="2"/><rect x="106" y="58" width="48" height="104" fill="none" stroke="#b65e45" stroke-dasharray="4 4"/><ellipse cx="130" cy="110" rx="16" ry="41.7" fill="#f4d7c7" stroke="#b65e45" stroke-width="2"/><path d="M246 110 H272 M265 103 L272 110 L265 117" fill="none" stroke="#48433e" stroke-width="1.5"/><circle cx="334" cy="110" r="42" fill="#f4d7c7" stroke="#b65e45" stroke-width="2"/><text x="314.00" y="181.00" fill="#b65e45" >circle</text><text x="48.00" y="197.00" fill="#48433e" >area changes with position</text></g></svg>