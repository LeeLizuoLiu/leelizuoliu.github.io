<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 255" role="img" aria-labelledby="title desc">
<title id="title">A sphere and its circular cross-section</title>
<desc id="desc">A shaded three-dimensional sphere has curved surface guides. A translucent tilted plane cuts the sphere; its circular intersection appears as an orange ellipse in perspective and as a circle in the face-on view at right.</desc>
