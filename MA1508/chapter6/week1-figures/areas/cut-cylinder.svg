<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 215" role="img" aria-labelledby="title desc"><title id="title">Circular cylinder cut by a plane</title><desc id="desc">A circular cylinder cut perpendicular to its axis produces a circular cross-section of constant area.</desc><g font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#48433e" stroke-linejoin="round" stroke-linecap="round"><path d="M65 50 H185 A27 60 0 0 1 185 170 H65Z" fill="#e5f0ec" stroke="#16736d" stroke-width="2"/><ellipse cx="65" cy="110" rx="27" ry="60" fill="#d6e8e3" stroke="#16736d" stroke-width="2"/><rect x="101" y="35" width="68" height="150" fill="none" stroke="#b65e45" stroke-dasharray="4 4"/><ellipse cx="135" cy="110" rx="27" ry="60" fill="#f4d7c7" stroke="#b65e45" stroke-width="2"/><path d="M246 110 H272 M265 103 L272 110 L265 117" fill="none" stroke="#48433e" stroke-width="1.5"/><circle cx="334" cy="110" r="48" fill="#f4d7c7" stroke="#b65e45" stroke-width="2"/><text x="314.00" y="181.00" fill="#b65e45" >circle</text><text x="57.00" y="197.00" fill="#48433e" >same area at every cut</text></g></svg>