<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 215" role="img" aria-labelledby="title desc"><title id="title">Box cut by a plane</title><desc id="desc">A rectangular box sliced perpendicular to its long axis produces a rectangle. Every parallel cut has the same area.</desc><g font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#48433e" stroke-linejoin="round" stroke-linecap="round"><path d="M30 150 L30 65 L175 65 L205 45 L205 130 L175 150Z" fill="#e5f0ec" stroke="#16736d" stroke-width="2"/><path d="M30 65 L60 45 H205 M175 65 L205 45 M175 65 V150" fill="none" stroke="#16736d" stroke-width="2"/>
<path d="M104 58 L147 29 L147 138 L104 167Z" fill="none" stroke="#b65e45" stroke-dasharray="4 4"/><path d="M110 65 L140 45 L140 130 L110 150Z" fill="#f4d7c7" stroke="#b65e45" stroke-width="2"/><path d="M246 110 H272 M265 103 L272 110 L265 117" fill="none" stroke="#48433e" stroke-width="1.5"/><rect x="295" y="67" width="77" height="86" fill="#f4d7c7" stroke="#b65e45" stroke-width="2"/><text x="305.00" y="181.00" fill="#b65e45" >rectangle</text><text x="55.00" y="197.00" fill="#48433e" >same area at every cut</text></g></svg>