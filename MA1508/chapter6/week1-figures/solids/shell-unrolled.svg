<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 265" role="img" aria-labelledby="title desc"><title id="title">The unrolled cylindrical shell</title><desc id="desc">The shell wall is unrolled to a thin rectangle with length two pi rho, height h and thickness dx.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad593e"/></marker></defs><style>text{font:18px system-ui,-apple-system,sans-serif;fill:#45413e}.small{font-size:15px}.v{fill:#6b4fa0}.c{fill:#ad593e}.g{fill:#456b2e}.axis{stroke:#45413e;stroke-width:2;fill:none}.rot{stroke:#ad593e;stroke-width:3;fill:none}.curve{stroke:#6b4fa0;stroke-width:3;fill:none}.guide{stroke:#8a8580;stroke-width:1.5;stroke-dasharray:5 4;fill:none}.measure{stroke:#ad593e;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)} </style><rect x="25" y="70" width="260" height="130" fill="#edd9cd" stroke="#ad593e" stroke-width="3"/><path d="M285 70l12 -8v130l-12 8Z" fill="#dcae98" stroke="#ad593e" stroke-width="2"/><path d="M25 220H285 M315 70V200" class="measure"/><path d="M285 55H297" stroke="#ad593e" stroke-width="3"/><text x="126" y="246" class="c">2πρ</text><text x="323" y="140" class="c">h</text><text x="288" y="45" class="c">dx</text></svg>