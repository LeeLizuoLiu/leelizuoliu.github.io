<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 295" role="img" aria-labelledby="title desc"><title id="title">Equilateral triangle section</title><desc id="desc">The base of the equilateral triangle is two square roots of one minus x squared. Its height is square root of three times square root of one minus x squared.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad593e"/></marker></defs><style>text{font:18px system-ui,-apple-system,sans-serif;fill:#45413e}.small{font-size:15px}.v{fill:#6b4fa0}.c{fill:#ad593e}.g{fill:#456b2e}.axis{stroke:#45413e;stroke-width:2;fill:none}.rot{stroke:#ad593e;stroke-width:3;fill:none}.curve{stroke:#6b4fa0;stroke-width:3;fill:none}.guide{stroke:#8a8580;stroke-width:1.5;stroke-dasharray:5 4;fill:none}.measure{stroke:#ad593e;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)} </style><polygon points="45,230 295,230 170,13.5" fill="#f3dfd8" stroke="#ad593e" stroke-width="3"/><path d="M170 13.5V230" class="guide"/><path d="M170 217H183V230" class="guide"/><path d="M45 244V254 M295 244V254 M45 250H295" stroke="#ad593e" stroke-width="2"/><path d="M183 15H203 M183 230H203 M198 15V230" class="measure"/><text x="61" y="278" class="c">base = 2√(1 − x²)</text><text x="206" y="127" class="c">height</text><text x="206" y="149" class="c">= √3√(1 − x²)</text><text x="52" y="221" class="small">60°</text><text x="261" y="221" class="small">60°</text></svg>