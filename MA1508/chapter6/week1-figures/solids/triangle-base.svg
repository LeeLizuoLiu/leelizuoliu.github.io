<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 285" role="img" aria-labelledby="title desc"><title id="title">Circular base and selected chord</title><desc id="desc">The disk x squared plus y squared is at most one. At a selected x, the chord extends from minus square root of one minus x squared to the positive square root.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad593e"/></marker></defs><style>text{font:18px system-ui,-apple-system,sans-serif;fill:#45413e}.small{font-size:15px}.v{fill:#6b4fa0}.c{fill:#ad593e}.g{fill:#456b2e}.axis{stroke:#45413e;stroke-width:2;fill:none}.rot{stroke:#ad593e;stroke-width:3;fill:none}.curve{stroke:#6b4fa0;stroke-width:3;fill:none}.guide{stroke:#8a8580;stroke-width:1.5;stroke-dasharray:5 4;fill:none}.measure{stroke:#ad593e;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)} </style><circle cx="158" cy="145" r="105" fill="#f0ebf5" stroke="#6b4fa0" stroke-width="3"/><path d="M32 145H294 M158 267V28" class="axis"/><path d="M215.8 57.3V232.7" stroke="#ad593e" stroke-width="7"/><path d="M215.8 145V232.7" stroke="#ad593e" stroke-width="2"/><circle cx="215.8" cy="57.3" r="4" fill="#ad593e"/><circle cx="215.8" cy="232.7" r="4" fill="#ad593e"/><text x="29" y="25" class="v">Base: x² + y² ≤ 1</text><text x="298" y="151" class="">x</text><text x="168" y="48" class="">y</text><text x="41" y="168" class="small">−1</text><text x="265" y="168" class="small">1</text><text x="227.75" y="170" class="c">x</text><text x="232" y="67" class="c">√(1 − x²)</text><text x="230" y="230" class="c">−√(1 − x²)</text></svg>