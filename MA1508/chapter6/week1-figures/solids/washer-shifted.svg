<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 352" role="img" aria-labelledby="title desc"><title id="title">Washer radii for a shifted horizontal axis</title><desc id="desc">The region under y equals x from zero to one rotates around the horizontal line y equals minus one. The outer radius is x plus one and the inner radius is one.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ad593e"/></marker></defs><style>text{font:18px system-ui,-apple-system,sans-serif;fill:#45413e}.small{font-size:15px}.v{fill:#6b4fa0}.c{fill:#ad593e}.g{fill:#456b2e}.axis{stroke:#45413e;stroke-width:2;fill:none}.rot{stroke:#ad593e;stroke-width:3;fill:none}.curve{stroke:#6b4fa0;stroke-width:3;fill:none}.guide{stroke:#8a8580;stroke-width:1.5;stroke-dasharray:5 4;fill:none}.measure{stroke:#ad593e;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)} </style><polygon points="60.0,190.0 280.0,75.0 280.0,190.0" fill="#e5dcf0"/><path d="M60 190L280 75" class="curve"/><path d="M45 190H305 M60 316V45" class="axis"/><path d="M45 305H305" class="rot"/><rect x="195.8" y="116.4" width="10" height="73.6" fill="#df9a7c"/><path d="M200.8 116.4H332 M200.8 190.0H391" class="guide"/><path d="M332 116.4V305 M391 190V305" class="measure"/><text x="174" y="91" class="v">y = x</text><text x="44" y="213" class="small">0</text><text x="278" y="211" class="small">1</text><text x="309" y="195" class="">x</text><text x="42" y="46" class="">y</text><text x="340" y="183" class="c">R = x + 1</text><text x="400" y="254" class="c">r = 1</text><text x="63" y="337" class="c">rotation axis: y = −1</text></svg>