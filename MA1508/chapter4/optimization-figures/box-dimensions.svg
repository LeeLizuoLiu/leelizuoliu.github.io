<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"><title>A closed box with a square base</title><desc>A closed box has base sides x and x and height h. The surface material makes two square faces and four rectangular faces.</desc><g stroke="#3f5f8a" stroke-width="2" stroke-linejoin="round"><path d="M110 105L270 105L330 60L170 60Z" fill="#f5f0e8"/><path d="M110 105L270 105L270 225L110 225Z" fill="#e6dfd8"/><path d="M270 105L330 60L330 180L270 225Z" fill="#cdd9e8"/><path d="M170 60V180L110 225M170 180H330" stroke-dasharray="5 5" fill="none"/></g><g fill="#3d3d3a" font-family="Arial,sans-serif" font-size="20"><text x="190" y="250" text-anchor="middle">x</text><text x="310" y="220">x</text><text x="349" y="130">h</text><text x="210" y="283" text-anchor="middle" font-size="18">2 square faces + 4 side faces</text></g></svg>